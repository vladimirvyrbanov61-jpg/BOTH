# SPECK 32/64 anomaly detection — default experiment config

data:
  seed: 42
  n_samples: 10000
  anomaly_fraction: 0.20
  fault_types:
    - random
    - flip
    - wrong_rounds
  wrong_rounds_values: [6, 11]
  flip_bits: 3
  feature_bits: true

split:
  train_ratio: 0.70
  val_ratio: 0.15
  split_seed: 0

features:
  include_bits: true
  include_stats: true

isolation_forest:
  n_estimators: 200
  max_samples: auto
  contamination: auto
  random_state: 42
  n_jobs: -1

autoencoder:
  hidden_dims: [64, 32, 16]
  latent_dim: 8
  activation: relu
  dropout: 0.0
  epochs: 60
  batch_size: 256
  lr: 0.001
  weight_decay: 0.00001
  patience: 10
  seed: 42

torch_autoencoder:
  hidden_dims: [128, 64, 32]
  latent_dim: 16
  dropout: 0.1
  epochs: 40
  batch_size: 512
  lr: 0.001
  weight_decay: 0.00001
  patience: 8
  seed: 42
  device: auto

scoring:
  target_fpr: 0.01
  score_agg: mean

paths:
  data_dir: data/
  model_dir: models/
  results_dir: results/
