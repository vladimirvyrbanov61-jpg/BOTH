# SPECK 32/64 cryptanalysis experiments

round_sweep:
  round_values: [6, 8, 10, 12, 14, 16, 18, 20, 22]
  n_samples_per_round: 2000
  seed: 42
  reference_model: torch_autoencoder
  model_dir: models/
  results_dir: results/round_sweep/

distinguisher:
  round_values: [6, 8, 10, 12, 14, 16, 18, 20]
  n_samples_per_round: 10000
  input_delta: [1, 0]
  feature_mode: xor_bits
  hidden_dims: [128, 64]
  dropout: 0.1
  epochs: 30
  batch_size: 512
  lr: 0.001
  weight_decay: 0.00001
  patience: 6
  seed: 42
  device: auto
  data_dir: data/
  model_dir: models/
  results_dir: results/distinguisher/

paths:
  data_dir: data/
  model_dir: models/
  results_dir: results/
