# Fast config for local smoke / CI verification (minutes, not hours)

round_sweep:
  round_values: [8, 16, 32]
  n_samples_per_round: 200
  seed: 42
  reference_model: torch_autoencoder
  model_dir: models/
  results_dir: results/round_sweep/

distinguisher:
  round_values: [8, 16]
  n_samples_per_round: 400
  input_delta: [1, 0]
  feature_mode: xor_bits
  hidden_dims: [64, 32]
  dropout: 0.1
  epochs: 5
  batch_size: 128
  lr: 0.001
  weight_decay: 0.00001
  patience: 3
  seed: 42
  device: auto
  data_dir: data/
  model_dir: models/
  results_dir: results/distinguisher/

paths:
  data_dir: data/
  model_dir: models/
  results_dir: results/
