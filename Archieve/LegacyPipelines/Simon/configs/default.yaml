# SIMON 32/64 anomaly detection — default experiment config

data:
  seed: 1
  n_samples: 500000
  chunk_size: 25000
  anomaly_fraction: 0.20
  fault_types:
    - random
    - flip
    - wrong_rounds
    - wrong_z
  wrong_rounds_values: [4, 8]
  wrong_z_index: 1
  flip_bits: 8
  feature_bits: true

split:
  train_ratio: 0.70
  val_ratio: 0.15
  split_seed: 0

features:
  include_bits: false
  include_stats: true
  include_transitions: true
  include_entropy: true
  include_hw_chi2: true
  include_recovery_error: true

isolation_forest:
  n_estimators: 200
  max_samples: auto
  contamination: auto
  random_state: 42
  n_jobs: -1

autoencoder:
  hidden_dims: [64, 32, 16]
  latent_dim: 8
  activation: relu
  dropout: 0.0
  epochs: 200
  batch_size: 256
  lr: 0.001
  weight_decay: 0.00001
  patience: 10
  seed: 1

torch_autoencoder:
  hidden_dims: [128, 64, 32]
  latent_dim: 16
  dropout: 0.1
  epochs: 200
  batch_size: 1024
  lr: 0.001
  weight_decay: 0.00001
  patience: 20
  seed: 1
  device: auto
  checkpoint_path: models/torch_autoencoder_best.pt

scoring:
  target_fpr: 0.01
  score_agg: mean

paths:
  data_dir: data/
  model_dir: models/
  results_dir: results/
